      - npm run verify:api-operations
      '6':
      - npm run typecheck
      - npm test -- --runInBand tests/unit/foundation/config.test.ts
      - docker compose config --quiet
      - node scripts/verify-runtime-config.mjs
      - npm run verify:api-operations
