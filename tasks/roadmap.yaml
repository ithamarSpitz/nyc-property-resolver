      - docker compose config --quiet
      - npm run acceptance:small:check
      '2':
      - npm run acceptance:small:validate-evidence
      '3':
      - npm run acceptance:scale:validate-evidence
      '4':
      - node -e "const fs=require('fs'); for (const f of ['README.md','DESIGN.md','RUN_LOG.md']) if (!fs.existsSync(f)) process.exit(1)"
      '5':
      - npm run verify:submission
