      '1':
      - npm run typecheck
      - docker compose build
      - docker compose up -d postgres
      - docker compose run --rm migrate
      - docker compose run --rm --no-deps worker npm test -- --runInBand tests/integration/api/property-violations-query.test.ts tests/integration/api/portfolio-violations-query.test.ts tests/unit/operations/scheduler.test.ts tests/unit/operations/ingest-ecb-cli.test.ts tests/unit/http/security-error-middleware.test.ts
