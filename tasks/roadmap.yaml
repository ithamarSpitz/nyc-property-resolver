project: nyc-property-resolver-ecb
sprints:
  S0-foundation:
    name: Repository, Runtime, Database and Test Foundation
    tasks:
      S0-T1:
        file: tasks/sprint-00-foundation/01-toolchain-test-foundation.md
        stage: 1
        depends_on: []
      S0-T2:
        file: tasks/sprint-00-foundation/02-config-logging-foundation.md
        stage: 2
        depends_on:
        - S0-T1
      S0-T3:
        file: tasks/sprint-00-foundation/03-prisma-postgres-foundation.md
        stage: 2
        depends_on:
        - S0-T1
      S0-T4:
        file: tasks/sprint-00-foundation/04-docker-compose-foundation.md
        stage: 2
        depends_on:
        - S0-T1
      S0-T6:
        file: tasks/sprint-00-foundation/06-api-port-contract.md
        stage: 3
        depends_on:
        - S0-T1
        - S0-T2
        - S0-T3
        - S0-T4
      S0-T5:
        file: tasks/sprint-00-foundation/05-foundation-integration-gate.md
        stage: 4
        depends_on:
        - S0-T6
    stage_verification:
      '1':
      - npm ci
      - npm run typecheck
      - npm test -- --runInBand
      '2':
      - npx prisma validate
      - npx prisma generate
      - npm run typecheck
      - npm test -- --runInBand
      - docker compose config --quiet
      '3':
      - npm run typecheck
      - npm test -- --runInBand tests/unit/foundation/config.test.ts
      - docker compose config --quiet
      '4':
      - npm run verify:foundation
